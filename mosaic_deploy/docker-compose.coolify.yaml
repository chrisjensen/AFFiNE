version: '3.8'

# AFFiNE Docker Compose for Coolify
# Uses internal Docker registry (not exposed to internet)
#
# Required environment variables in Coolify:
#   - AFFINE_REVISION: Image tag to deploy (e.g., latest or abc1234)
#   - POSTGRES_PASSWORD: Database password
#   - AFFINE_SERVER_HOST: Your AFFiNE domain
#   - AFFINE_SERVER_EXTERNAL_URL: Full external URL (e.g., https://affine.yourdomain.com)

services:
  affine:
    # Internal registry - accessed by container name
    image: 'localhost:5000/affine:${AFFINE_REVISION:-latest}'
    pull_policy: always
    container_name: affine-app
    ports:
      - '${PORT:-3010}:3010'
    depends_on:
      affine-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - '${UPLOAD_LOCATION:-./affine-storage}:/root/.affine/storage'
      - '${CONFIG_LOCATION:-./affine-config}:/root/.affine/config'
    environment:
      - NODE_ENV=production
      - AFFINE_CONFIG_PATH=/root/.affine/config
      - REDIS_SERVER_HOST=redis
      - 'DATABASE_URL=postgres://${POSTGRES_USER:-affine}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-affine}'
      - 'AFFINE_SERVER_HOST=${AFFINE_SERVER_HOST}'
      - AFFINE_SERVER_PORT=3010
      - 'AFFINE_SERVER_HTTPS=${AFFINE_SERVER_HTTPS:-true}'
      - 'AFFINE_SERVER_EXTERNAL_URL=${AFFINE_SERVER_EXTERNAL_URL}'
      - AFFINE_INDEXER_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://localhost:3010/api/healthz')"
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Migration service - runs database migrations before app starts
  affine-migration:
    image: 'localhost:5000/affine:${AFFINE_REVISION:-latest}'
    container_name: affine-migration
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - '${CONFIG_LOCATION:-./affine-config}:/root/.affine/config'
    environment:
      - NODE_ENV=production
      - AFFINE_CONFIG_PATH=/root/.affine/config
      - 'DATABASE_URL=postgres://${POSTGRES_USER:-affine}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-affine}'
    command: ['node', './scripts/self-host-predeploy.js']
    restart: 'no'

  redis:
    image: 'redis:7-alpine'
    container_name: affine-redis
    command:
      - redis-server
      - '--maxmemory'
      - 512mb
      - '--maxmemory-policy'
      - noeviction
      - '--save'
      - ''
      - '--appendonly'
      - 'no'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - 'redis-data:/data'
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  postgres:
    image: 'pgvector/pgvector:pg16'
    container_name: affine-postgres
    shm_size: 512mb
    command:
      - postgres
      - '-c'
      - shared_buffers=512MB
      - '-c'
      - work_mem=32MB
      - '-c'
      - maintenance_work_mem=128MB
      - '-c'
      - effective_cache_size=1GB
      - '-c'
      - max_connections=100
      - '-c'
      - wal_buffers=16MB
    restart: unless-stopped
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-affine}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-affine}'
      PGDATA: /var/lib/postgresql/data/pgdata
      # Match official selfhost config - trust mode ignores passwords
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-affine}'
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

volumes:
  redis-data:
  postgres-data:
